name: Daily paper-trade cycle

# Runs ONE cycle of the autonomous daemon, once per Indian trading day after
# NSE market close. Persists portfolio state in data/paper_state.json which
# is committed back to the repo so positions survive across runs.
#
# Broker:
# - Default LocalPaperBroker + yfinance (works for NSE/BSE without any
#   external account).
# - US fallback to Alpaca if ALPACA_API_KEY + ALPACA_API_SECRET secrets are
#   set AND --market NYSE is passed.
#
# Schedule (3 decision points per NSE trading day, Mon-Fri):
# - 04:00 UTC = 09:30 IST → 15 min after NSE open (morning rebalance)
# - 07:30 UTC = 13:00 IST → midday rebalance
# - 10:30 UTC = 16:00 IST → 30 min after close (end-of-day rebalance)
# India does NOT observe daylight saving, so these UTC times are fixed
# year-round. GitHub Actions cron can drift ~15 min — fine for these windows.
# Indian trading holidays are NOT auto-skipped; the daemon handles them by
# producing no new orders when there's no new data.
#
# Manual test: Actions tab -> Daily paper-trade cycle -> Run workflow

on:
  schedule:
    - cron: "0 4 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "30 10 * * 1-5"
  workflow_dispatch:
    inputs:
      profile:
        description: "Risk profile for this run"
        required: false
        default: "conservative"
        type: choice
        options:
          - conservative
          - balanced
          - aggressive
      broker:
        description: "Broker to use"
        required: false
        default: "local"
        type: choice
        options:
          - local
          - auto
          - alpaca
      market:
        description: "Market"
        required: false
        default: "NSE"
        type: choice
        options:
          - NSE
          - BSE
          - NYSE

permissions:
  contents: write    # needed to commit paper_state.json back to repo

concurrency:
  group: daily-trade
  cancel-in-progress: false

jobs:
  trade:
    name: Run one daemon cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROFILE: ${{ github.event.inputs.profile || 'conservative' }}
      BROKER_CHOICE: ${{ github.event.inputs.broker || 'local' }}
      MARKET: ${{ github.event.inputs.market || 'NSE' }}
      # Hard-pinned to paper for this workflow.
      TRADING_MODE: paper
      LIVE_TRADING_ENABLED: "false"
      APP_ENV: production
      LOG_LEVEL: INFO
      DATA_ROOT: ./data
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      RISK_MAX_DAILY_LOSS_PCT: "0.02"
      RISK_MAX_DRAWDOWN_PCT: "0.10"
      RISK_MAX_POSITION_PCT: "0.06"
      RISK_MAX_SECTOR_PCT: "0.30"
      RISK_MAX_LEVERAGE: "1.0"
      # Secrets — these can be empty; the daemon falls back to LocalPaperBroker.
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'github-actions-not-used-by-daemon' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write token to commit state file back
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Show broker selection
        run: |
          if [ -n "$ALPACA_API_KEY" ] && [ -n "$ALPACA_API_SECRET" ] && [ "$BROKER_CHOICE" != "local" ]; then
            echo "Alpaca keys present — using Alpaca paper broker."
          else
            echo "No Alpaca keys (or local override) — using LocalPaperBroker with yfinance prices."
            echo "State persists in data/paper_state.json (committed back after each run)."
          fi

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Run one daemon cycle
        run: |
          python scripts/run_daemon.py \
            --run-once \
            --profile "$PROFILE" \
            --broker "$BROKER_CHOICE" \
            --market "$MARKET" \
            2>&1 | tee data/last_run.log

      - name: Show portfolio summary
        if: always()
        continue-on-error: true
        run: |
          if [ "$MARKET" = "NSE" ] || [ "$MARKET" = "BSE" ]; then
            python scripts/show_portfolio.py --recent 10 --currency INR
          else
            python scripts/show_portfolio.py --recent 10 --currency USD
          fi

      - name: Commit updated state back to repo
        # Only attempts a commit if paper_state.json actually changed.
        # No-op when using Alpaca (no local state file is touched).
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: |
          git config user.name  "stock-market-bot"
          git config user.email "stock-market-bot@users.noreply.github.com"
          git add -A data/paper_state.json data/last_run.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no state changes to commit"
          else
            # No [skip ci] — we WANT deploy_pages.yml to fire on this push so
            # the dashboard picks up the new state. ci.yml ignores data/** changes.
            git commit -m "chore(state): paper trading update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Upload run log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-log-${{ github.run_id }}
          path: data/last_run.log
          retention-days: 30
