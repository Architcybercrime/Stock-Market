name: CI

# Sanity checks on every push to main. Lint and typecheck steps are
# non-blocking (continue-on-error) so a style nit never blocks a deploy.
# Tests are kept strict — if pytest fails, that's a real signal.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint (advisory)
        continue-on-error: true
        run: ruff check libs services scripts tests

      - name: Pytest
        env:
          POSTGRES_HOST: localhost
        run: pytest --maxfail=5 -q

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # Skip npm cache here — no package-lock.json yet, and the speedup
          # isn't worth the failure-on-missing-lockfile.

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund --loglevel=error
          fi

      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      - name: Typecheck (advisory)
        continue-on-error: true
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_BASE_PATH: /Stock-Market
        run: npm run build

  docker-build:
    name: Build Docker images (smoke)
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: stockmarket-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: false
          tags: stockmarket-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
