name: Deploy dashboard to GitHub Pages

# Builds the Next.js static dashboard and publishes it to GitHub Pages.
# Triggered on:
#   - push to main when frontend/ or paper_state.json change
#   - manual dispatch from the Actions tab
#
# Setup (one-time):
#   1. Settings -> Pages -> Source = "GitHub Actions"
#   2. (optional) Settings -> Pages -> Custom domain if you have one
#
# After first deploy the dashboard is live at:
#   https://architcybercrime.github.io/Stock-Market/

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "data/paper_state.json"
      - ".github/workflows/deploy_pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      # When deploying to https://<user>.github.io/<repo>/, the basePath
      # must match the repo name. If you set up a custom domain, set this
      # to "" via repo variable BASE_PATH.
      NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH != null && vars.BASE_PATH || '/Stock-Market' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install (no lock yet acceptable on first run)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build static export
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
