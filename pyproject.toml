[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock_market"
version = "0.1.0"
description = "Institutional AI trading platform"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "orjson>=3.10",
    "click>=8.1",

    # Data
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "httpx>=0.27",

    # Storage
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "redis>=5.0",

    # ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "torch>=2.2",
    "pytorch-lightning>=2.2",
    "mlflow>=2.12",

    # NLP
    "transformers>=4.40",

    # Backtesting / metrics
    "scipy>=1.12",
    "statsmodels>=0.14",

    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # Observability
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.4",
    "ipython>=8.20",
    "jupyterlab>=4.1",
]
streaming = [
    "aiokafka>=0.10",
    "confluent-kafka>=2.4",
]

[project.scripts]
sm-ingest = "scripts.ingest_history:main"
sm-train = "scripts.train_model:main"
sm-backtest = "scripts.run_backtest:main"

[tool.setuptools.packages.find]
include = ["libs*", "services*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
