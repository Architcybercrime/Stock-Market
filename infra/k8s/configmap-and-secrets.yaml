# Template only — populate at deploy time via sealed-secrets, external-secrets,
# or a CI-driven sops/age workflow. Do not commit real secrets.

apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: stockmarket
data:
  TRADING_MODE: paper
  LIVE_TRADING_ENABLED: "false"
  RISK_MAX_DAILY_LOSS_PCT: "0.02"
  RISK_MAX_DRAWDOWN_PCT: "0.10"
  RISK_MAX_POSITION_PCT: "0.05"
  RISK_MAX_SECTOR_PCT: "0.25"
  RISK_MAX_LEVERAGE: "1.0"
---
# Replace with a sealed-secret / ExternalSecret in production.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: stockmarket
type: Opaque
stringData:
  POSTGRES_USER: trader
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: stockmarket
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: REPLACE_ME_32_BYTES_HEX
